[project]
name = "scigraphdb-ml"
version = "0.1.0"
description = "CPU paper embeddings for SciGraphDB"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx[socks]>=0.28,<1",
    "python-dotenv>=1.0,<2",
    "psycopg[binary]>=3.2,<4",
    "sentence-transformers>=5.1,<6",
    "torch>=2.8,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]

[tool.uv]
package = false

# Avoid downloading CUDA runtime packages for the default CPU workflow.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
markers = [
    "integration: needs an empty disposable DATABASE_URL_TEST database",
    "model: downloads the pinned model and embeds 100 CPU fixture papers",
]
