name: Go

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Resolve modules
        run: go mod tidy
      - name: Format
        run: |
          go fmt ./...
          git diff --exit-code -- '*.go'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Module sums for initial bootstrap
        run: cat go.sum
