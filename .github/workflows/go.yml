name: Go

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Resolve modules
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(git ls-files --others --exclude-standard -- go.sum)"
      - name: Module checksums
        run: |
          go mod verify
      - name: Format
        run: |
          go fmt ./...
          git diff --exit-code -- '*.go'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  migration-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: scigraph
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: scigraph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scigraph -d scigraph_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://scigraph:integration-only@127.0.0.1:5432/scigraph_test?sslmode=disable
      DATABASE_URL_TEST: postgres://scigraph:integration-only@127.0.0.1:5432/scigraph_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Database constraints and migration cycle
        run: go test -tags integration ./db/migrations -v
      - name: Importer fixture cycle
        run: go test -tags integration ./internal/importer -v
      - name: End-to-end migration import and API
        run: go test -tags integration ./internal/app -v
      - name: Exact vector Top-K baseline and EXPLAIN
        run: go test -tags integration ./internal/search -v
      - name: CLI up down up
        run: |
          go run ./cmd/migrate status
          go run ./cmd/migrate up
          go run ./cmd/migrate status
          go run ./cmd/migrate down
          go run ./cmd/migrate up

  local-compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Start, migrate, rotate password, and preserve data
        run: |
          cp .env.example .env
          sed -i 's/POSTGRES_PASSWORD=change-me-locally/POSTGRES_PASSWORD=first-ci-password/' .env
          sed -i 's/PG_PORT=5432/PG_PORT=55432/' .env
          make up
          make migrate
          ./scripts/compose.sh exec -T db sh -c 'psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "INSERT INTO papers (id, openalex_id, title) VALUES (1, '\''W-ci'\'', '\''Persistence check'\'')"'
          sed -i 's/POSTGRES_PASSWORD=first-ci-password/POSTGRES_PASSWORD=second-ci-password/' .env
          make up
          make migrate-status
          ./scripts/compose.sh exec -T db sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" psql -X -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM papers WHERE openalex_id = '\''W-ci'\''"' | grep -qx '1'
      - name: Stop local database
        if: always()
        run: ./scripts/compose.sh down

  python-embeddings:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: scigraph
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: scigraph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scigraph -d scigraph_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://scigraph:integration-only@127.0.0.1:5432/scigraph_test?sslmode=disable
      DATABASE_URL_TEST: postgres://scigraph:integration-only@127.0.0.1:5432/scigraph_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.18'
      - name: Python environment and checks
        run: |
          uv python install 3.12
          uv sync --locked
          uv run --locked ruff format --check ml
          uv run --locked ruff check ml
          uv run --locked python -m pytest -q -m 'not integration'
      - name: Migrate, embed 100 CPU fixtures, and rerun
        env:
          RUN_MODEL_SMOKE: '1'
        run: |
          go run ./cmd/migrate up
          uv run --locked python -m pytest -v -m integration
          go run ./cmd/migrate down
          go run ./cmd/migrate up
